<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="description" content="The original ResOC illustration, brought to life through a single character’s resilience and recovery journey.">
 <title>ResOC — A journey to resilience</title>
 <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff5728' d='M3 4l10 7-10 7v-6l5-3zM3 22L29 3v9L12 26l-9-4zm15 4l11-8v11z'/%3E%3C/svg%3E">
 <link rel="preload" as="image" href="./assets/background-BQFGITCE.png">
  <script type="module" crossorigin src="./assets/index-BRdoWa2Z.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-zg3cx12f.css">
<style>
html,body{width:100%;height:auto;min-width:0;margin:0;overflow:hidden;background:transparent}
main{width:100%;height:auto;min-height:0;display:block;padding:0}
.experience{width:100%;max-width:none;margin:0}
.playback{display:none}
.message,noscript{display:none}
</style></head>
<body>
 <main>
  <figure class="experience" aria-label="ResOC resilience and recovery journey">
   <div class="scene" role="img" aria-label="One orange-shirted character moves through six recovery stages in the original ResOC illustration.">
    <img class="background" src="./assets/background-BQFGITCE.png" width="1914" height="822" alt="ResOC, powered by Agent Mesh: Risk; Long time to recover, Human effort; Unified Resilience Observability; Backup and Recovery Operations; Human Approved, Agent Mesh fixes; Business Keep Running." draggable="false">
    <canvas id="character" width="1914" height="822" aria-hidden="true"></canvas>
   </div>
   <figcaption class="playback">
    <div class="transport">
     <button id="play" aria-label="Pause animation" disabled><span id="play-icon" aria-hidden="true">Ⅱ</span><span id="play-text">Pause</span></button>
     <button id="replay" aria-label="Replay animation from the beginning" disabled><span aria-hidden="true">↶</span> Replay</button>
    </div>
    <div class="status"><span class="stage-number" id="stage-number">01 / 06</span><span id="stage-label" aria-live="polite">Loading artwork…</span></div>
    <div class="options">
     <label class="speed-label">Speed <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
     <label class="loop-label"><input type="checkbox" id="loop" checked> Loop</label>
    </div>
    <label class="scrubber-label" for="scrubber">Animation progress</label><input id="scrubber" type="range" min="0" max="1000" value="0" aria-label="Animation progress">
   </figcaption>
  </figure>
  <p id="message" class="message" role="status"></p>
  <noscript>This animation needs JavaScript. The original stationary scene is shown above.</noscript>
 </main>
</body>
</html>
