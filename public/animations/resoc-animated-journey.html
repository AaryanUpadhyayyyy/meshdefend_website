        labels.forEach((l, i) => l.classList.toggle("on", i === active));
    }
    const tg = POSE[pose].slice();
    if (moving) {
        phase += dt * .0078;
        const s = Math.sin(phase);
        tg[0] = s * 30;
        tg[1] = -s * 30;
        tg[2] = 28 * Math.max(0, Math.cos(phase));
        tg[3] = 28 * Math.max(0, -Math.cos(phase));
        tg[4] = -s * 24 + 6;
        tg[5] = s * 24 - 6;
        tg[6] = tg[7] = -20;
    }
    if (pose === "sit") {
        tg[6] += Math.sin(now / 70) * 8;
        tg[7] += Math.sin(now / 70 + 2) * 8;
    }
    const k = 1 - Math.exp(-dt / 80);
    for (let i = 0; i < 9; i++)
        cur[i] += (tg[i] - cur[i]) * k;
    const bob = moving ? -Math.abs(Math.sin(phase)) * 3.5 : Math.sin(now / 520) * -1.2;
    P.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})scale(1.02)`);
    P.style.opacity = String(op);
    B.setAttribute("transform", `translate(0,${(-39 + cur[8] + bob).toFixed(1)})`);
    tL.setAttribute("transform", `translate(-8,0)rotate(${cur[0]})`);
    tR.setAttribute("transform", `translate(8,0)rotate(${cur[1]})`);
    sL.setAttribute("transform", `translate(0,20)rotate(${cur[2]})`);
    sR.setAttribute("transform", `translate(0,20)rotate(${cur[3]})`);
    aL.setAttribute("transform", `translate(-17,-27)rotate(${cur[4]})`);
    aR.setAttribute("transform", `translate(17,-27)rotate(${cur[5]})`);
    fL.setAttribute("transform", `translate(0,16)rotate(${cur[6]})`);
    fR.setAttribute("transform", `translate(0,16)rotate(${cur[7]})`);
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
